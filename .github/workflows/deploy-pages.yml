name: Publicar no GitHub Pages

on:
  push:
    branches: [master, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar site e simulador
        run: |
          node scripts/render-markdown.mjs
          node tests/simulator.test.mjs
          python3 tests/site-validation.py
          python3 tests/chrome-smoke.py

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato estático
        run: |
          node scripts/render-markdown.mjs
          mkdir -p .pages/site
          cp -R site/. .pages/site/
          cp -R content lessons exercises .pages/
          cp LICENSE commands.md .pages/
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=site/">' > .pages/index.html
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
